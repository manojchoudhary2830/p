services:
  - type: web
    name: pgbooking-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_URL
        value: /uploads
      - key: BED_LOCK_TTL_MIN
        value: 10
      - key: BOOST_PRICE_INR
        value: 499
      - key: BOOST_DURATION_DAYS
        value: 30
      - key: CANCEL_REFUND_FRACTION_AFTER_CONFIRM
        value: 0.8
      - key: CANCEL_GRACE_DAYS
        value: 2
      - key: APP_NAME
        value: NextGen PG Booking — Jaipur & NCR
      - key: SENDER_EMAIL
        value: manoj.portfolio.website@gmail.com
