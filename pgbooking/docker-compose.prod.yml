version: '3.9'

networks:
  pgbooking_prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 16 + PostGIS (Primary)
  # ─────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: pgbooking_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/postgres-backup.sh:/usr/local/bin/backup.sh:ro
      - ./database/migrations:/database/migrations:ro
      - ./database/seeds:/database/seeds:ro
      - ./database/scripts/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    networks:
      pgbooking_prod:
        ipv4_address: 172.30.0.10
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c work_mem=8MB
      -c huge_pages=off
      -c wal_level=replica
      -c max_wal_senders=3
      -c ssl=off
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ─────────────────────────────────────────────
  # Redis 7 (Production)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: pgbooking_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_prod_data:/data
    networks:
      pgbooking_prod:
        ipv4_address: 172.30.0.11
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 512M

  # ─────────────────────────────────────────────
  # Backend API (2 replicas for HA)
  # ─────────────────────────────────────────────
  backend:
    image: ${DOCKER_REGISTRY}/pgbooking-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      pgbooking_prod:
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ─────────────────────────────────────────────
  # NGINX (TLS termination + reverse proxy)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: pgbooking_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      pgbooking_prod:
        ipv4_address: 172.30.0.30
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────
  # Certbot (SSL cert renewal)
  # ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: pgbooking_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      pgbooking_prod:
