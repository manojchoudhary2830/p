upstream backend_cluster {
  least_conn;
  server backend:3000 max_fails=3 fail_timeout=30s;
  keepalive 64;
}

# Redirect HTTP → HTTPS
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server
server {
  listen 443 ssl http2;
  server_name api.pgbooking.in;

  # ── TLS Configuration ─────────────────────────
  ssl_certificate     /etc/letsencrypt/live/api.pgbooking.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.pgbooking.in/privkey.pem;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;
  ssl_stapling        on;
  ssl_stapling_verify on;

  # ── Security Headers ──────────────────────────
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "DENY" always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

  # ── Request limits ────────────────────────────
  client_max_body_size 10m;
  client_body_timeout  30s;
  client_header_timeout 10s;
  send_timeout 30s;

  # ── Health endpoint (no rate limit) ───────────
  location = /health {
    proxy_pass http://backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  # ── Razorpay Webhook (raw body, separate limit) ──
  location = /api/v1/payments/webhook/razorpay {
    limit_req zone=api_global burst=10 nodelay;
    proxy_pass http://backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # ── Auth endpoints (strict rate limit) ────────
  location ~ ^/api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
  }

  # ── Main API ───────────────────────────────────
  location /api/ {
    limit_req zone=api_global burst=100 nodelay;
    limit_conn conn_limit 30;

    proxy_pass http://backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffer_size     128k;
    proxy_buffers         4 256k;
    proxy_busy_buffers_size 256k;
  }

  # ── Socket.IO ─────────────────────────────────
  location /socket.io/ {
    proxy_pass http://backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # ── Block malicious patterns ───────────────────
  location ~* \.(php|asp|aspx|env|git)$ { return 444; }
  location ~* /\.                        { deny all; return 404; }
  location = /favicon.ico                { access_log off; return 204; }
}
