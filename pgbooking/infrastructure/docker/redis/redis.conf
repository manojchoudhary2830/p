bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 300
tcp-keepalive 300

# Persistence (RDB snapshot + AOF)
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Performance
hz 10
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Logging
loglevel notice
logfile ""

# Databases (0=cache, 1=sessions, 2=locks, 3=bullmq)
databases 16

# Security (set via env in prod)
# requirepass your_redis_password
