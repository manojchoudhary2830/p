global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    app: pgbooking

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: pgbooking_backend
    static_configs:
      - targets: ["backend:3000"]
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
    scrape_interval: 30s

  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 30s
